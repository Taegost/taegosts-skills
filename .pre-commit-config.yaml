repos:
  - repo: local
    hooks:
      - id: update-indexes
        name: Update documentation indexes
        entry: scripts/update-indexes.py
        language: python
        pass_filenames: false
        always_run: true
        description: Runs the index updater before each commit to keep INDEX.md files in sync.
      - id: shellcheck
        name: Shellcheck shell scripts
        entry: scripts/run-shellcheck.sh
        language: script
        pass_filenames: false
        files: \.sh$
        description: Runs shellcheck on all shell scripts before commit; blocks the commit on any finding. Requires shellcheck installed locally (see .shellcheckrc).
      - id: verify-script-refs
        name: Verify skill script references resolve via CLAUDE_PLUGIN_ROOT/CLAUDE_SKILL_DIR
        entry: scripts/verify-script-refs.sh
        language: script
        pass_filenames: false
        always_run: true
        description: Fails on unguarded runtime script invocations in SKILL.md and references/*.md; enforces the script path resolution standard (docs/standards/script-extraction-standards.md, Issue #115).
      - id: verify-scripts
        name: Verify script command-surface compliance
        entry: scripts/verify-scripts.sh --all
        language: script
        pass_filenames: false
        always_run: true
        description: Gate checks --help/exec-bit/syntax on command scripts; tests/ skipped, scripts/lib/ syntax-only (docs/standards/script-extraction-standards.md, Issue #118).
